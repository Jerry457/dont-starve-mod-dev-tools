[package]
name = "dont-starve-mod-dev-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["inspector"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["inspector"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
arc-swap = "1.9.2"
log = "0.4.33"
flexi_logger = "0.31.10"
anyhow = "1.0.104"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustc-hash = "2.1.3"
